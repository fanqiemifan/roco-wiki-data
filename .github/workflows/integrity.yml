name: integrity

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时巡检一次镜像内容
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-checksums:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 重新生成 SHA256SUMS 并重签各数据文件
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          cd data
          sha256sum *.json > SHA256SUMS
          printf '%s' "$SIGNING_PRIVATE_KEY" > /tmp/signing-key.pem
          for f in *.json; do
            openssl dgst -sha256 -sign /tmp/signing-key.pem -out "$f.sig" "$f"
          done
          rm -f /tmp/signing-key.pem

      - name: 有变化则自动提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "SHA256SUMS 与签名无变化，跳过提交"
          else
            git commit -m "chore: 自动更新 SHA256SUMS 与签名 [skip ci]"
            git push
          fi

  verify-mirrors:
    needs: update-checksums
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 记录基准 commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 校验 jsDelivr 内容（哈希 + 签名）
        run: |
          sha_file="$GITHUB_WORKSPACE/data/SHA256SUMS"
          pub="$GITHUB_WORKSPACE/signing-key.pub"
          files=$(awk '{print $2}' "$sha_file")
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/jsdelivr && mkdir -p /tmp/jsdelivr
            cp "$sha_file" /tmp/jsdelivr/
            cd /tmp/jsdelivr
            ok=1
            for f in $files; do
              if ! curl -fsSL "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.base.outputs.sha }}/data/$f" -o "$f"; then ok=0; break; fi
              if ! curl -fsSL "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.base.outputs.sha }}/data/$f.sig" -o "$f.sig"; then ok=0; break; fi
            done
            if [ "$ok" -eq 1 ] && sha256sum -c SHA256SUMS; then
              sig_ok=1
              for f in $files; do
                openssl dgst -sha256 -verify "$pub" -signature "$f.sig" "$f" || sig_ok=0
              done
              if [ "$sig_ok" -eq 1 ]; then
                echo "jsDelivr 哈希与签名校验通过"
                exit 0
              fi
            fi
            echo "第 $attempt 次校验未通过（新 commit 可能尚未在 CDN 索引），30 秒后重试"
            sleep 30
          done
          echo "::error::jsDelivr 内容与仓库不一致（哈希或签名不符），可能被劫持"
          exit 1

      - name: 校验 GitHub Pages 内容（哈希 + 签名）
        run: |
          sha_file="$GITHUB_WORKSPACE/data/SHA256SUMS"
          pub="$GITHUB_WORKSPACE/signing-key.pub"
          files=$(awk '{print $2}' "$sha_file")
          base="https://${{ github.repository_owner }}.github.io/roco-wiki-data/data"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pages && mkdir -p /tmp/pages
            cp "$sha_file" /tmp/pages/
            cd /tmp/pages
            ok=1
            for f in $files; do
              if ! curl -fsSL "$base/$f" -o "$f"; then ok=0; break; fi
              if ! curl -fsSL "$base/$f.sig" -o "$f.sig"; then ok=0; break; fi
            done
            if [ "$ok" -eq 1 ] && sha256sum -c SHA256SUMS; then
              sig_ok=1
              for f in $files; do
                openssl dgst -sha256 -verify "$pub" -signature "$f.sig" "$f" || sig_ok=0
              done
              if [ "$sig_ok" -eq 1 ]; then
                echo "GitHub Pages 哈希与签名校验通过"
                exit 0
              fi
            fi
            echo "第 $attempt 次校验未通过（Pages 可能仍在构建），60 秒后重试"
            sleep 60
          done
          echo "::error::GitHub Pages 内容与仓库不一致（哈希或签名不符），可能被劫持或构建异常"
          exit 1
